<svg xmlns="http://www.w3.org/2000/svg" width="620" height="620" viewBox="0 0 620 620"><defs>
        <pattern id="pencil-forest-kraft" width="34" height="34" patternUnits="userSpaceOnUse">
          <rect width="34" height="34" fill="#d9c49a"/>
          <path d="M0 11H34M0 25H34" stroke="#bfa476" stroke-width=".7" opacity=".55"/>
          <path d="M9 0V34M23 0V34" stroke="#e3d0a8" stroke-width=".5" opacity=".45"/>
          <path d="M2 4h5M20 30h6" stroke="#b1935f" stroke-width="1" opacity=".3"/>
        </pattern>
        <pattern id="pencil-forest-hatchA" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-28)">
          <path d="M0 0V9" stroke="#6f9b4e" stroke-width="3" opacity=".34"/>
        </pattern>
        <pattern id="pencil-forest-hatchB" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(17)">
          <path d="M0 0V10" stroke="#c8892f" stroke-width="2.4" opacity=".26"/>
        </pattern>
        <pattern id="pencil-forest-hatchC" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(-63)">
          <path d="M0 0V13" stroke="#4f7f3c" stroke-width="2" opacity=".2"/>
        </pattern>
        <pattern id="pencil-forest-hatchD" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(9)">
          <path d="M0 0V16" stroke="#8b6f3e" stroke-width="1.2" opacity=".18"/>
        </pattern>
        <filter id="pencil-forest-grain" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency=".62" numOctaves="3" seed="7" result="n"/>
          <feColorMatrix in="n" type="saturate" values="0"/>
          <feComponentTransfer><feFuncA type="linear" slope=".16" intercept="0"/></feComponentTransfer>
        </filter>
        <filter id="pencil-forest-wob" x="-8%" y="-8%" width="116%" height="116%">
          <feTurbulence type="fractalNoise" baseFrequency=".022" numOctaves="3" seed="13" result="w"/>
          <feDisplacementMap in="SourceGraphic" in2="w" scale="3.1" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <filter id="pencil-forest-edge" x="-14%" y="-14%" width="128%" height="128%">
          <feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="2" seed="4" result="w"/>
          <feDisplacementMap in="SourceGraphic" in2="w" scale="5.4" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <filter id="pencil-forest-crayon" x="-35%" y="-35%" width="170%" height="170%">
          <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" seed="31" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G" result="d"/>
          <feTurbulence type="fractalNoise" baseFrequency="1.3" numOctaves="2" seed="3" result="g"/>
          <feColorMatrix in="g" type="saturate" values="0" result="gg"/>
          <feComponentTransfer in="gg" result="ga"><feFuncA type="linear" slope=".34" intercept=".72"/></feComponentTransfer>
          <feComposite in="d" in2="ga" operator="in"/>
        </filter>
        <radialGradient id="pencil-forest--blk" cx="34%" cy="24%" r="78%">
          <stop offset="0" stop-color="#7d8272"/><stop offset=".3" stop-color="#4b5044"/>
          <stop offset=".68" stop-color="#31362b"/><stop offset="1" stop-color="#1d2018"/>
        </radialGradient>
        <radialGradient id="pencil-forest--wht" cx="34%" cy="24%" r="78%">
          <stop offset="0" stop-color="#fffdf4"/><stop offset=".32" stop-color="#f6efd9"/>
          <stop offset=".68" stop-color="#ddceac"/><stop offset="1" stop-color="#b0a07c"/>
        </radialGradient>
      </defs><rect width="620" height="620" rx="16" fill="url(#pencil-forest-kraft)"/>
        <rect x="0" y="0" width="620" height="620" rx="18" fill="url(#pencil-forest-hatchA)" opacity=".72"/>
        <rect x="0" y="0" width="620" height="620" rx="18" fill="url(#pencil-forest-hatchB)" opacity=".6"/>
        <rect x="0" y="0" width="620" height="620" rx="18" fill="url(#pencil-forest-hatchC)" opacity=".55"/>
        <rect x="0" y="0" width="620" height="620" rx="18" fill="url(#pencil-forest-hatchD)" opacity=".5"/>
        <ellipse class="pencil-forest-glow" cx="170" cy="200" rx="300" ry="240" fill="#fff3c4" opacity=".2"/>
        <rect x="0" y="0" width="620" height="620" rx="18" filter="url(#pencil-forest-grain)" opacity=".6" pointer-events="none"/>
      
