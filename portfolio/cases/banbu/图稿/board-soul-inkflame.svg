<svg xmlns="http://www.w3.org/2000/svg" width="620" height="620" viewBox="0 0 620 620"><defs>
        <!-- 盘面：墨青石（四档渐变）。比上一版亮半档、冷半档 —— 参考图里
             盘就是"比背景亮三四档的中性灰"，压暗它等于把主体埋进墨里。 -->
        <linearGradient id="soul-inkflame-board" x1="0" y1="0" x2=".72" y2="1">
          <stop offset="0" stop-color="#5b6167"/><stop offset=".38" stop-color="#4d535a"/>
          <stop offset=".74" stop-color="#41474d"/><stop offset="1" stop-color="#383e44"/>
        </linearGradient>
        <!-- 中央气眼：**多档渐隐**（上一版只有两档，边缘有一圈看得见的界，
             就是"不通透"的来源之一）。 -->
        <radialGradient id="soul-inkflame-spot" cx="50%" cy="44%" r="66%">
          <stop offset="0" stop-color="#8d99a3" stop-opacity=".30"/>
          <stop offset=".42" stop-color="#6f7981" stop-opacity=".16"/>
          <stop offset=".72" stop-color="#545b62" stop-opacity=".06"/>
          <stop offset="1" stop-color="#2b2f34" stop-opacity="0"/>
        </radialGradient>
        <!-- 湿雾：飘在盘面上那一层的填充。极淡（中心 .18），只在掠过时看得见。 -->
        <radialGradient id="soul-inkflame-mist" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#e8eff5" stop-opacity=".18"/>
          <stop offset=".48" stop-color="#dbe4ec" stop-opacity=".095"/>
          <stop offset="1" stop-color="#cfd9e2" stop-opacity="0"/>
        </radialGradient>
        <!-- 顶部透光：光从上面来才有体积感 —— 只压在盘的上缘 130px 内。 -->
        <linearGradient id="soul-inkflame-rim" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#cdd6de" stop-opacity=".14"/>
          <stop offset=".55" stop-color="#b9c3cc" stop-opacity=".05"/>
          <stop offset="1" stop-color="#aab4bd" stop-opacity="0"/>
        </linearGradient>
        <!-- 湿墨晕：两团极淡的墨，让石头不是一块均匀的塑料板 -->
        <radialGradient id="soul-inkflame-wash" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#0d1114" stop-opacity=".22"/>
          <stop offset=".55" stop-color="#0d1114" stop-opacity=".10"/>
          <stop offset="1" stop-color="#0d1114" stop-opacity="0"/>
        </radialGradient>
        <!-- 盘面石纹：横向长弧，像石头上的水痕。压得极淡。 -->
        <pattern id="soul-inkflame-grain" width="180" height="150" patternUnits="userSpaceOnUse">
          <g fill="none" stroke="#b3bfc7" stroke-linecap="round">
            <path d="M6 34c46-13 92-11 138 3" stroke-width="1.5" opacity=".055"/>
            <path d="M20 88c52-16 96-9 146 6" stroke-width="1.1" opacity=".038"/>
            <path d="M2 128c40-10 82-12 122 1" stroke-width="1.3" opacity=".034"/>
            <path d="M96 16c30-6 58-4 84 6" stroke-width=".9" opacity=".042"/>
            <path d="M64 62c34-11 66-7 96 4" stroke-width="1.2" opacity=".03"/>
          </g>
        </pattern>
        <!-- 四角暗角：这一版**大幅收手**（.46 → .26，起步 .56）。
             上一版靠它"收视线"，代价是整块盘被压成一坨死灰 —— 那正是
             用户说的"不够通透"。现在只留最外一圈。 -->
        <radialGradient id="soul-inkflame-vign" cx="50%" cy="46%" r="78%">
          <stop offset=".56" stop-color="#101418" stop-opacity="0"/>
          <stop offset=".82" stop-color="#0e1216" stop-opacity=".10"/>
          <stop offset="1" stop-color="#0a0d10" stop-opacity=".26"/>
        </radialGradient>
        <!-- 黑子：近黑（在灰盘上边界清楚）。留一点冷灰的高光，
             否则整枚子是一块死黑、没有"子是圆的"的体积感。 -->
        <radialGradient id="soul-inkflame-ink" cx="34%" cy="28%" r="82%">
          <stop offset="0" stop-color="#3d464d"/><stop offset=".3" stop-color="#1a2025"/>
          <stop offset=".72" stop-color="#0b0e11"/><stop offset="1" stop-color="#06080a"/>
        </radialGradient>
        <!-- 黑子里的**内火**：实心 + 硬边。
             ⚠ 别改回"淡到边缘透明度归零"的写法 —— 那样边界糊掉，
             肉眼读到的就是"内火和外轮廓连在一起"（用户原话「没有一段隔离的距离」）。
             所有 stop 都不带 stop-opacity，最后一档也必须是不透明的。
             ⚠ 这一版把中心从纯白压到 #f2f7fb：手数（#f2f6f9 + 墨色描边）
             正好压在它上面，纯白底会把手数的描边吃掉一圈。 -->
        <radialGradient id="soul-inkflame-inkCore" cx="44%" cy="30%" r="74%">
          <stop offset="0" stop-color="#f2f7fb"/><stop offset=".52" stop-color="#e6edf3"/>
          <stop offset="1" stop-color="#bcc7d1"/>
        </radialGradient>
        <!-- 白子：素白 + 一圈外发光（参考图里白子明显"亮出来"，比黑子抢眼）。 -->
        <radialGradient id="soul-inkflame-core" cx="34%" cy="28%" r="84%">
          <stop offset="0" stop-color="#ffffff"/><stop offset=".46" stop-color="#f8fbfd"/>
          <stop offset=".84" stop-color="#e6ecf0"/><stop offset="1" stop-color="#c9d3da"/>
        </radialGradient>
        <!-- 白子的外发光（画在子底下的一圈柔光）。
             ⚠ 用户 10-12「周围的光不用太多了」：实测焰边上的有效不透明度
             顶 .25 / 侧 .21，白子在灰盘上像在"发光"而不是"亮"。
             收成 .40/.17 并把椭圆从 0.87r×1.18r 收到 0.82r×1.10r 之后，
             焰边只剩 .10/.14 —— 约减一半，仍留一圈能看出的边光。 -->
        <radialGradient id="soul-inkflame-coreGlow" cx="50%" cy="50%" r="50%">
          <stop offset=".62" stop-color="#eef4f8" stop-opacity=".4"/>
          <stop offset=".82" stop-color="#dfe8ee" stop-opacity=".17"/>
          <stop offset="1" stop-color="#c9d3da" stop-opacity="0"/>
        </radialGradient>
        <!-- 白子里的**内火**：同一朵焰的墨面（"黑白子是同一朵魂火的正负片"的另一半）。
             ⚠ 中心从 #454f58 提到 #5c6772：手数是 #232b32 的深墨字，
             压在近黑的内火上两个方向都读不出，提亮到中墨后靠白色描边分家。 -->
        <radialGradient id="soul-inkflame-coreInk" cx="44%" cy="32%" r="74%">
          <stop offset="0" stop-color="#5c6772"/><stop offset=".52" stop-color="#28313a"/>
          <stop offset="1" stop-color="#0b1014"/>
        </radialGradient>
        <!-- 当前手的光环：浓墨（浅盘上用暗环） -->
        <linearGradient id="soul-inkflame-halo" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" stop-color="#39424a"/><stop offset=".5" stop-color="#0a0d0e"/>
          <stop offset="1" stop-color="#5c6871"/>
        </linearGradient>
      </defs><rect width="620" height="620" rx="14" fill="url(#soul-inkflame-board)"/>
        <rect x="0" y="0" width="620" height="620" rx="14" fill="url(#soul-inkflame-spot)"/>
        <g class="soul-inkflame-mist">
          <ellipse cx="168" cy="206" rx="238" ry="104" fill="url(#soul-inkflame-mist)"/>
          <ellipse cx="470" cy="352" rx="196" ry="86" fill="url(#soul-inkflame-mist)" opacity=".8"/>
          <ellipse cx="286" cy="524" rx="262" ry="98" fill="url(#soul-inkflame-mist)" opacity=".62"/>
        </g>
        <rect x="0" y="0" width="620" height="620" rx="14" fill="url(#soul-inkflame-grain)"/>
        <ellipse cx="118" cy="132" rx="228" ry="168" fill="url(#soul-inkflame-wash)" opacity=".5"/>
        <ellipse cx="524" cy="486" rx="252" ry="196" fill="url(#soul-inkflame-wash)" opacity=".42"/>
        <rect x="0" y="0" width="620" height="130" rx="14" fill="url(#soul-inkflame-rim)"/>
        <rect x="0" y="0" width="620" height="620" rx="14" fill="url(#soul-inkflame-vign)"/>
        <rect x="3.5" y="3.5" width="613" height="613" rx="13" fill="none" stroke="#b6c0c9" stroke-width="1.2" opacity=".13"/><path d="M42 42H578 M42 42V578 M42 80.28571428571428H578 M80.28571428571428 42V578 M42 118.57142857142857H578 M118.57142857142857 42V578 M42 156.85714285714286H578 M156.85714285714286 42V578 M42 195.14285714285714H578 M195.14285714285714 42V578 M42 233.42857142857142H578 M233.42857142857142 42V578 M42 271.7142857142857H578 M271.7142857142857 42V578 M42 310H578 M310 42V578 M42 348.2857142857143H578 M348.2857142857143 42V578 M42 386.57142857142856H578 M386.57142857142856 42V578 M42 424.85714285714283H578 M424.85714285714283 42V578 M42 463.14285714285717H578 M463.14285714285717 42V578 M42 501.42857142857144H578 M501.42857142857144 42V578 M42 539.7142857142858H578 M539.7142857142858 42V578 M42 578H578 M578 42V578 " fill="none" stroke="#a4acb3" stroke-width="1.05" opacity="0.56"/><path d="M46 46H574M46 574H574M46 46V574M574 46V574" fill="none" stroke="#8f979e" stroke-width="1.6" opacity=".44"/><path d="M310 46V574M46 310H574" fill="none" stroke="#c9d2d9" stroke-width="1.7" opacity=".30"/><circle cx="156.85714285714286" cy="156.85714285714286" r="3.1" fill="#cdd6dd"/><circle cx="156.85714285714286" cy="463.14285714285717" r="3.1" fill="#cdd6dd"/><circle cx="463.14285714285717" cy="156.85714285714286" r="3.1" fill="#cdd6dd"/><circle cx="463.14285714285717" cy="463.14285714285717" r="3.1" fill="#cdd6dd"/><circle cx="310" cy="310" r="3.1" fill="#cdd6dd"/></svg>