<svg xmlns="http://www.w3.org/2000/svg" width="620" height="620" viewBox="0 0 620 620"><defs>
        <filter id="naive-papercut-wob" x="-30%" y="-30%" width="160%" height="160%">
       <feTurbulence type="fractalNoise" baseFrequency=".013" numOctaves="2" seed="1011" result="w"/>
       <feDisplacementMap in="SourceGraphic" in2="w" scale="2" xChannelSelector="R" yChannelSelector="G"/>
     </filter>
        <filter id="naive-papercut-wob2" x="-30%" y="-30%" width="160%" height="160%">
       <feTurbulence type="fractalNoise" baseFrequency=".026" numOctaves="2" seed="1022" result="w"/>
       <feDisplacementMap in="SourceGraphic" in2="w" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
     </filter>
        
    <filter id="naive-papercut-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".78" numOctaves="2" seed="148"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".08"/></feComponentTransfer>
    </filter>
        <!-- 窗纸底色：用**陈年窗纸的赭黄**，不是亮米白。
             两个理由：① 白子贴米白底上实测只有 1.87，看不见；
             ② 红纸筋压在赭黄上，明度差才拉得开（红 relLum≈.11 vs 底≈.45 → 3.3:1）。 -->
        <radialGradient id="naive-papercut-lit" cx="42%" cy="36%" r="82%">
          <stop offset="0" stop-color="#c9b189"/><stop offset=".6" stop-color="#b1966f"/>
          <stop offset="1" stop-color="#8b7454"/>
        </radialGradient>
        <linearGradient id="naive-papercut-base" x1="0" y1="0" x2=".5" y2="1">
          <stop offset="0" stop-color="#c2a97f"/><stop offset="1" stop-color="#98805c"/>
        </linearGradient>
      </defs><rect width="620" height="620" rx="16" fill="url(#naive-papercut-lit)"/>
        <rect width="620" height="620" fill="url(#naive-papercut-lit)"/>
